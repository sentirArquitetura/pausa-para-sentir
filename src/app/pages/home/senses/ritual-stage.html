<div class="stage" aria-hidden="true">
  <div class="halo"></div>
  <div class="breath" [class.active]="!!breath()" [class.in]="breath() === 'in'"></div>
  <div class="waves" [class.on]="waves()"><i></i><i></i><i></i></div>

  @switch (scene()) {
    @case ('cup') {
      <!-- PALADAR: xícara rústica de cerâmica com chá de lavanda -->
      <div class="scene cup" animate.enter="scene-in" animate.leave="scene-out">
        <app-ritual-smoke variant="steam" class="steam" />
        <svg class="art" viewBox="0 0 260 190" width="260" height="190">
          <defs>
            <linearGradient id="rs-clay" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#6d3424" />
              <stop offset="0.35" stop-color="#b4634a" />
              <stop offset="0.62" stop-color="#a5583f" />
              <stop offset="1" stop-color="#5f2d1f" />
            </linearGradient>
            <linearGradient id="rs-glaze" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#bfb29a" />
              <stop offset="0.4" stop-color="#f1e9dc" />
              <stop offset="0.62" stop-color="#e6dccb" />
              <stop offset="1" stop-color="#a99b83" />
            </linearGradient>
            <linearGradient id="rs-shade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0" />
              <stop offset="1" stop-color="#000" stop-opacity="0.28" />
            </linearGradient>
            <radialGradient id="rs-tea" cx="0.42" cy="0.35" r="0.75">
              <stop offset="0" stop-color="#dcaa5e" />
              <stop offset="0.5" stop-color="#a8692c" />
              <stop offset="1" stop-color="#5e3412" />
            </radialGradient>
            <linearGradient id="rs-saucer" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#8d7258" />
              <stop offset="0.45" stop-color="#d9c6aa" />
              <stop offset="1" stop-color="#7f654d" />
            </linearGradient>
            <pattern id="rs-speckle" width="22" height="22" patternUnits="userSpaceOnUse">
              <circle cx="3" cy="4" r="0.9" fill="#6f604c" opacity="0.55" />
              <circle cx="15" cy="9" r="0.6" fill="#6f604c" opacity="0.45" />
              <circle cx="9" cy="17" r="1.1" fill="#8b5a3c" opacity="0.4" />
              <circle cx="19" cy="19" r="0.7" fill="#6f604c" opacity="0.5" />
            </pattern>
            <clipPath id="rs-cup-clip">
              <path d="M50 70 C 50 128, 80 158, 130 158 C 180 158, 210 128, 210 70 Z" />
            </clipPath>
          </defs>

          <!-- pires -->
          <ellipse cx="130" cy="168" rx="120" ry="20" fill="url(#rs-saucer)" />
          <ellipse cx="130" cy="164" rx="106" ry="14" fill="#cbb697" />
          <ellipse cx="130" cy="164" rx="106" ry="14" fill="url(#rs-speckle)" />
          <ellipse cx="132" cy="162" rx="82" ry="8" fill="rgba(50, 30, 18, 0.4)" />

          <!-- alça -->
          <path d="M203 86 C 242 82, 246 130, 197 134" fill="none" stroke="#d8ccb7" stroke-width="13" stroke-linecap="round" />
          <path d="M203 86 C 242 82, 246 130, 197 134" fill="none" stroke="#f3ecdf" stroke-width="4" stroke-linecap="round" opacity="0.6" />

          <!-- corpo: argila terracota com esmalte creme escorrido -->
          <g clip-path="url(#rs-cup-clip)">
            <rect x="40" y="60" width="180" height="110" fill="url(#rs-clay)" />
            <path
              d="M40 60 H220 V116 C 206 124, 198 110, 186 120 C 172 131, 164 115, 150 124 C 138 132, 126 117, 112 126 C 98 135, 88 119, 74 127 C 62 134, 54 120, 40 125 Z"
              fill="url(#rs-glaze)"
            />
            <rect x="40" y="60" width="180" height="110" fill="url(#rs-speckle)" />
            <rect x="40" y="60" width="180" height="110" fill="url(#rs-shade)" />
          </g>

          <!-- borda e chá -->
          <ellipse cx="130" cy="70" rx="80" ry="14" fill="#efe6d7" />
          <ellipse cx="130" cy="72" rx="72" ry="10.5" fill="url(#rs-tea)" />
          <ellipse class="tea-glint" cx="110" cy="70" rx="24" ry="3" fill="rgba(255, 236, 200, 0.4)" />

          <!-- ramo de lavanda -->
          <g class="lavender">
            <path d="M26 176 C 52 168, 72 160, 96 146" fill="none" stroke="#7d8a6e" stroke-width="1.6" stroke-linecap="round" />
            <g fill="#a491c2">
              <ellipse cx="80" cy="155" rx="3.2" ry="2" transform="rotate(-30 80 155)" />
              <ellipse cx="84" cy="151" rx="3.2" ry="2" transform="rotate(-40 84 151)" />
              <ellipse cx="87" cy="154" rx="3" ry="1.8" transform="rotate(-20 87 154)" />
              <ellipse cx="89" cy="148" rx="3" ry="1.8" transform="rotate(-45 89 148)" />
              <ellipse cx="92" cy="150" rx="2.8" ry="1.7" transform="rotate(-25 92 150)" />
              <ellipse cx="94" cy="145" rx="2.6" ry="1.6" transform="rotate(-50 94 145)" />
              <ellipse cx="98" cy="144" rx="2.2" ry="1.4" transform="rotate(-35 98 144)" />
            </g>
          </g>
        </svg>
      </div>
    }
    @case ('incense') {
      <!-- OLFATO: incenso em pedra, fumaça perfumada e partículas de aroma -->
      <div class="scene incense" animate.enter="scene-in" animate.leave="scene-out">
        <app-ritual-smoke variant="incense" class="incense-smoke" />
        <div class="aroma">
          @for (p of aroma; track $index) {
            <i [style.--dx.px]="p.dx" [style.animation-delay.s]="p.delay" [style.width.px]="p.size" [style.height.px]="p.size"></i>
          }
        </div>
        <svg class="art" viewBox="0 0 260 260" width="260" height="260">
          <defs>
            <radialGradient id="rs-ember">
              <stop offset="0" stop-color="#fff3c4" />
              <stop offset="0.35" stop-color="#ff9a3c" stop-opacity="0.9" />
              <stop offset="1" stop-color="#ff6a2a" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="rs-stone" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#7f776a" />
              <stop offset="0.45" stop-color="#d8d0c2" />
              <stop offset="1" stop-color="#6f675b" />
            </linearGradient>
            <pattern id="rs-terrazzo" width="30" height="30" patternUnits="userSpaceOnUse">
              <path d="M4 6l4-2 2 4-4 2z" fill="#b4634a" opacity="0.7" />
              <path d="M18 3l3 1-1 3-3-1z" fill="#3a4530" opacity="0.65" />
              <path d="M22 18l5 1-1 4-5-2z" fill="#cfae82" opacity="0.8" />
              <path d="M8 22l3-1 2 3-4 1z" fill="#8b9680" opacity="0.7" />
              <circle cx="14" cy="13" r="0.9" fill="#5f6455" opacity="0.5" />
            </pattern>
          </defs>
          <ellipse cx="130" cy="236" rx="92" ry="16" fill="rgba(0, 0, 0, 0.4)" />
          <path d="M46 214 C 46 233, 214 233, 214 214 L 214 223 C 214 242, 46 242, 46 223 Z" fill="url(#rs-stone)" />
          <ellipse cx="130" cy="214" rx="84" ry="14" fill="#e6ddcf" />
          <ellipse cx="130" cy="214" rx="84" ry="14" fill="url(#rs-terrazzo)" />
          <!-- cinzas caídas -->
          <g fill="#8f897f">
            <path d="M152 211 q 5 -2 9 0 q -4 2 -9 0z" />
            <path d="M164 216 q 3 -1.5 6 0 q -3 1.5 -6 0z" />
            <path d="M146 218 q 3 -1 5 0 q -2 1 -5 0z" />
          </g>
          <!-- vareta: bambu + massa aromática + cinza na ponta -->
          <line x1="112" y1="214" x2="127" y2="152" stroke="#c9a77c" stroke-width="3" stroke-linecap="round" />
          <line x1="127" y1="152" x2="149" y2="66" stroke="#5a3b28" stroke-width="4.4" stroke-linecap="round" />
          <line x1="148.6" y1="68" x2="150.2" y2="62" stroke="#a39d93" stroke-width="4.4" />
          <circle class="ember-glow" cx="150.5" cy="61" r="12" fill="url(#rs-ember)" />
          <circle class="ember" cx="150.5" cy="61" r="2.6" fill="#ffb15a" />
        </svg>
      </div>
    }
    @default {
      <!-- VELA: foto real do produto, com chama acesa animada -->
      <div class="scene candle" animate.enter="scene-in" animate.leave="scene-out">
        <app-ritual-smoke variant="candle" class="candle-smoke" />
        <img class="candle-photo" src="img/vela-ritual.webp" alt="" width="265" height="305" />
        <div class="flame-glow"></div>
        <div class="flame-anchor">
          <div class="flame-sway">
            <div class="flame-pulse">
              <svg class="flame" viewBox="0 0 40 90">
                <defs>
                  <radialGradient id="rs-flame" cx="50%" cy="76%" r="62%">
                    <stop offset="0" stop-color="#fffef6" />
                    <stop offset="0.22" stop-color="#ffeab4" />
                    <stop offset="0.48" stop-color="#ffc264" />
                    <stop offset="0.76" stop-color="#ee7e35" stop-opacity="0.85" />
                    <stop offset="1" stop-color="#d9622a" stop-opacity="0" />
                  </radialGradient>
                  <radialGradient id="rs-flame-core" cx="50%" cy="80%" r="50%">
                    <stop offset="0" stop-color="#6d8fd0" stop-opacity="0.55" />
                    <stop offset="1" stop-color="#6d8fd0" stop-opacity="0" />
                  </radialGradient>
                </defs>
                <path
                  d="M20 2 C 24 22, 36 38, 36 60 C 36 76, 29 88, 20 88 C 11 88, 4 76, 4 60 C 4 38, 16 22, 20 2 Z"
                  fill="url(#rs-flame)"
                />
                <ellipse cx="20" cy="79" rx="6.5" ry="9" fill="url(#rs-flame-core)" />
              </svg>
            </div>
          </div>
        </div>
      </div>
    }
  }
</div>

<p class="breath-word" [class.on]="!!breath()" aria-live="polite">
  {{ breath() === 'out' ? 'expire' : 'inspire' }}
</p>
<p class="touch-hint">{{ hint() }}</p>
