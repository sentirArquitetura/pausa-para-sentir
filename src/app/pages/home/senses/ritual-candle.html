<div class="stage" aria-hidden="true">
  <div class="halo"></div>

  <div class="breath" [class.active]="!!breath()" [class.in]="breath() === 'in'"></div>

  <div class="waves" [class.on]="waves()"><i></i><i></i><i></i></div>

  <svg class="smoke" viewBox="0 0 120 260">
    <defs>
      <filter id="ritual-smoke-blur" x="-50%" y="-10%" width="200%" height="120%">
        <feGaussianBlur stdDeviation="2.4" />
      </filter>
    </defs>
    <g filter="url(#ritual-smoke-blur)">
      <path class="w1" d="M60 260 C 52 230, 70 205, 60 180 S 46 130, 62 100 S 72 50, 56 0" />
      <path class="w2" d="M60 260 C 68 228, 50 200, 62 172 S 76 120, 58 92 S 44 40, 64 0" />
      <path class="w3" d="M60 260 C 56 235, 64 214, 58 190 S 50 150, 66 118 S 58 60, 70 0" />
    </g>
  </svg>

  <div class="candle">
    <div class="flame-glow"></div>
    <div class="flame-wrap">
      <svg class="flame" viewBox="0 0 40 90">
        <defs>
          <radialGradient id="ritual-flame" cx="50%" cy="76%" r="62%">
            <stop offset="0" stop-color="#fffef6" />
            <stop offset="0.22" stop-color="#ffeab4" />
            <stop offset="0.48" stop-color="#ffc264" />
            <stop offset="0.76" stop-color="#ee7e35" stop-opacity="0.85" />
            <stop offset="1" stop-color="#d9622a" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="ritual-flame-core" cx="50%" cy="80%" r="50%">
            <stop offset="0" stop-color="#6d8fd0" stop-opacity="0.55" />
            <stop offset="1" stop-color="#6d8fd0" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path
          d="M20 2 C 24 22, 36 38, 36 60 C 36 76, 29 88, 20 88 C 11 88, 4 76, 4 60 C 4 38, 16 22, 20 2 Z"
          fill="url(#ritual-flame)"
        />
        <ellipse cx="20" cy="79" rx="6.5" ry="9" fill="url(#ritual-flame-core)" />
      </svg>
    </div>
    <span class="wick"></span>

    <div class="jar">
      <div class="wax"></div>
      <div class="label">
        <span>Pausa</span>
        <span>para sentir</span>
        <small>baunilha &amp; quartzo rosa</small>
      </div>
    </div>
    <div class="ground-shadow"></div>
  </div>
</div>

<p class="breath-word" [class.on]="!!breath()" aria-live="polite">
  {{ breath() === 'out' ? 'expire' : 'inspire' }}
</p>
