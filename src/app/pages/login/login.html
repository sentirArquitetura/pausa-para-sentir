<div class="page login-page">
  <div class="container login-grid">
    <div class="login-intro">
      <p class="eyebrow">Pausa para Sentir</p>
      <h1 class="page-title">A pausa é sua.</h1>
      <p class="muted">
        Entre ou crie sua conta para garantir seu kit e acompanhar cada etapa do pedido — do pagamento até a sua porta.
      </p>
      <img src="img/kit4.jpeg" alt="" class="arch" />
    </div>

    <div class="card login-card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" [class.on]="tab() === 'entrar'" [attr.aria-selected]="tab() === 'entrar'" (click)="switchTab('entrar')">
          Entrar
        </button>
        <button type="button" role="tab" [class.on]="tab() === 'criar'" [attr.aria-selected]="tab() === 'criar'" (click)="switchTab('criar')">
          Criar conta
        </button>
      </div>

      @if (error()) {
        <p class="alert" role="alert">{{ error() }}</p>
      }

      <form #f="ngForm" (ngSubmit)="submit(f)">
        <label class="field">
          <span>Usuário</span>
          <input
            name="username"
            [(ngModel)]="form.username"
            required
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            autocomplete="username"
          />
          @if (tab() === 'criar') {
            <small>Escolha um nome para entrar, ex.: maria.silva — não precisa ser e-mail nem celular.</small>
          }
        </label>
        <label class="field">
          <span>Senha</span>
          <div class="password">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              [(ngModel)]="form.password"
              required
              [attr.autocomplete]="tab() === 'criar' ? 'new-password' : 'current-password'"
            />
            <button type="button" class="link-btn" (click)="showPassword.update((v) => !v)">
              {{ showPassword() ? 'ocultar' : 'mostrar' }}
            </button>
          </div>
          @if (tab() === 'criar') {
            <small>Pelo menos {{ minLength }} caracteres.</small>
          }
        </label>

        <button class="btn full" type="submit" [disabled]="busy() || f.invalid">
          @if (tab() === 'criar') {
            {{ busy() ? 'Criando…' : 'Criar conta' }}
          } @else {
            {{ busy() ? 'Entrando…' : 'Entrar' }}
          }
        </button>

        <p class="switch-hint muted">
          @if (tab() === 'entrar') {
            Primeira vez por aqui? <button type="button" class="link-btn" (click)="switchTab('criar')">Crie sua conta</button>
          } @else {
            Já tem conta? <button type="button" class="link-btn" (click)="switchTab('entrar')">Entrar</button>
          }
        </p>
      </form>
    </div>
  </div>
</div>
